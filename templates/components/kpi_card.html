{% macro kpi_card(title, value, icon, extra_info='', is_critical=false, icon_color_class='') %}
<div class="kpi-card" style="display: flex; align-items: center; gap: 16px; {% if is_critical %}border-color: var(--color-danger);{% endif %}">
    <div class="kpi-icon {{ icon_color_class }}" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; {% if is_critical %}background-color: var(--color-danger-light); color: var(--color-danger);{% endif %}">
        <i class="fa-solid {{ icon }}"></i>
    </div>
    <div style="display: flex; flex-direction: column;">
        <span class="section-title" style="font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px;">{{ title }}</span>
        <div class="kpi-value" style="font-size: 24px; font-weight: 700; margin: 0;">{{ value|safe }}</div>
        {% if extra_info %}
        <div class="text-secondary" style="font-size: 12px; margin-top: 4px;">{{ extra_info }}</div>
        {% endif %}
    </div>
</div>
{% endmacro %}
