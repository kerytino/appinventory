<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Excellence Collection{% endblock %}</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}?v=5.0.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}?v=5.0.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=5.0.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}?v=5.0.0">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Login View Overlay -->
    <div id="login-overlay" style="position: fixed; inset: 0; background: var(--color-background); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <div class="logo" style="margin-bottom: 32px;">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="The Excellence Collection" style="width: 100%; max-width: 220px; object-fit: contain;">
        </div>
        <div class="login-card" style="padding: 40px; width: 100%; max-width: 400px; border-radius: 16px; background: var(--color-surface); box-shadow: var(--shadow-lg);">
            <h2 style="text-align: center; margin-bottom: 24px; color: var(--color-text);">Iniciar Sesión</h2>
            <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
                <input type="text" id="login-username" placeholder="Usuario" required class="form-control">
                <input type="password" id="login-password" placeholder="Contraseña" required class="form-control">
                <p id="login-error" style="color: var(--color-danger); font-size: 14px; display: none; margin: 0;"></p>
                <button type="submit" class="btn btn-primary" style="padding: 12px; font-size: 16px; width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container" id="main-app" style="display: none;">
        
        <!-- Sidebar Partial -->
        {% include 'partials/sidebar.html' %}
        
        <!-- Main Wrapper -->
        <main class="main-wrapper">
            
            <!-- Header Partial -->
            <header class="top-header">
                <div class="header-title-area">
                    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                    <span class="page-subtitle">Hola, admin 👋</span>
                </div>
                
                <div class="header-actions">
                    <!-- Global Search -->
                    <div class="header-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="global-search-input" placeholder="Buscar equipos, series...">
                    </div>

                    <!-- Theme Selector -->
                    <select id="theme-selector" class="theme-pill-select">
                        <option value="light">☀️ Modo Claro</option>
                        <option value="dark">🌙 Modo Oscuro</option>
                    </select>

                    <!-- Notifications -->
                    <button class="btn-icon" title="Notificaciones" id="btn-notifications-icon" style="position: relative;">
                        <i class="fa-regular fa-bell" style="font-size: 16px;"></i>
                        <span style="position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background-color: var(--color-danger); border-radius: 50%;"></span>
                    </button>
                    
                    <!-- User Profile -->
                    <div class="user-profile-widget">
                        <div class="user-avatar-circle">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span id="logged-username" class="user-profile-name">Cargando...</span>
                        
                        <button id="btn-change-password" class="btn-icon" title="Cambiar Contraseña" style="width: 28px; height: 28px;">
                            <i class="fa-solid fa-key" style="font-size: 12px;"></i>
                        </button>
                        <button id="btn-logout" class="btn-icon" title="Cerrar Sesión" style="width: 28px; height: 28px; color: var(--color-danger);">
                            <i class="fa-solid fa-right-from-bracket" style="font-size: 12px;"></i>
                        </button>
                    </div>
                </div>
            </header>

            
            <!-- Content Area -->
            <div class="page-content">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Modals from original SPA -->
    {% include 'partials/modals.html' %}

    <!-- Password Modal -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="section-title">Cambiar Contraseña</h3>
                <button class="btn-icon" id="btn-close-password-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="password-form" class="form-group" style="display: flex; flex-direction: column; gap: 16px;">
                    <div>
                        <label class="form-label">Contraseña Actual</label>
                        <input type="password" id="current-password" required class="form-control">
                    </div>
                    <div>
                        <label class="form-label">Nueva Contraseña</label>
                        <input type="password" id="new-password" required class="form-control">
                    </div>
                    <div>
                        <label class="form-label">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" required class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="btn-cancel-password">Cancelar</button>
                <button type="submit" form="password-form" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Global scripts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="{{ url_for('static', filename='js/app.js') }}?v=5.3.1"></script>
    <script src="{{ url_for('static', filename='js/components.js') }}?v=5.3.0"></script>
    <script src="{{ url_for('static', filename='js/tables.js') }}?v=5.3.0"></script>
    <script src="{{ url_for('static', filename='js/modals.js') }}?v=5.3.0"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
