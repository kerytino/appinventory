<script>
function toggleSidebarSubmenu(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    var grp = document.getElementById('nav-group-inventory');
    if (grp) {
        grp.classList.toggle('collapsed');
        try {
            localStorage.setItem('sidebar_warehouses_collapsed', grp.classList.contains('collapsed'));
        } catch(err) {}
    }
}

(function() {
    try {
        if (localStorage.getItem('sidebar_warehouses_collapsed') === 'true') {
            var grp = document.getElementById('nav-group-inventory');
            if (grp) grp.classList.add('collapsed');
        }
    } catch(err) {}
})();
</script>
